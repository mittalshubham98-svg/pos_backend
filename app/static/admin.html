<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilani Supply Co. — Admin</title>
<link rel="manifest" href="/static/admin-manifest.json">
<meta name="theme-color" content="#ec3013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pilani Admin">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@600&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#f3f2f2;color:#201e1d;font-family:"Archivo",system-ui,sans-serif;font-size:15px;line-height:1.55}
  a{color:#ec3013;text-underline-offset:3px}
  a:hover{color:#ae1800}
  h1,h2,h3,h4,h5,h6{margin:0;font-family:"Archivo",system-ui,sans-serif;font-weight:800;line-height:1.12;letter-spacing:-0.015em}
  input,textarea,button,select{font-family:inherit}
  :focus{outline:none}
  :focus-visible{outline:2px solid #ec3013;outline-offset:2px}
  ::selection{background:rgba(236,48,19,.3)}
  .mono{font-family:"Archivo Narrow","Archivo",monospace}
  @keyframes drawerUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .noscroll::-webkit-scrollbar{width:0;height:0}
  .thumb{width:32px;height:32px;filter:grayscale(1) contrast(1.08);background:repeating-linear-gradient(135deg,#e3e0e0 0 4px,#d7d3d3 4px 8px);background-size:cover;background-position:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="app" style="min-height:100vh;width:1440px;margin:0 auto;background:#f3f2f2"></div>

<script src="/static/api.js"></script>
<script>
const TOKEN_KEY = "pilani_admin_token";
const HEAD_STYLE = "font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(32,30,29,.55);padding:8px 8px 8px 0;border-bottom:2px solid rgba(32,30,29,.4)";
const HEAD_R = HEAD_STYLE + ";text-align:right;padding-right:8px";
const TABS = [
  { id: "dash", label: "Dashboard" },
  { id: "orders", label: "Orders" },
  { id: "invoices", label: "Invoices" },
  { id: "customers", label: "Customers" },
  { id: "catalog", label: "Catalogue" },
  { id: "ocr", label: "Parchi OCR" },
  { id: "reports", label: "Reports & settings" },
];

const state = {
  token: localStorage.getItem(TOKEN_KEY) || null,
  booting: !!localStorage.getItem(TOKEN_KEY),
  loginUser: "", loginPw: "", loginError: "", loginBusy: false,
  tab: "dash",
  toast: "",

  orders: [], selectedPoId: null, confirmDeletePoId: null,
  customName: "", customQty: "1", customRate: "", customGst: "5",
  itemSearchQ: "", itemSearchResults: [], itemSearchBusy: false,
  watchItems: [],

  customers: [], selectedCustomerId: null, customerDetail: null,
  newName: "", newPhone: "", newPassword: "", newCred: "",
  paymentAmount: "", paymentNote: "",
  confirmResetPwId: null, resetPwInput: "", resetCred: "",
  adminCurPw: "", adminNewPw: "", adminPwBusy: false,

  catalog: [], catQ: "", voiceListeningFor: null,
  importOpen: false, importFile: null, importFileName: "", importResult: null, importBusy: false,
  addItemOpen: false, addItemBusy: false,
  newItemName: "", newItemCategory: "", newItemBrand: "", newItemSize: "", newItemCase: "1",
  newItemMrp: "", newItemTaxable: "", newItemGst: "5", newItemTaxType: "Exclusive",
  newItemPromo: "", newItemDisc: "0", newItemDaily: false, newItemAisle: "", newItemHsn: "",
  confirmDeleteItemId: null,

  ocrFile: null, ocrFileName: "", ocrState: "idle", ocrError: "", ocrRows: [],

  settings: null, ledgerRows: [], ledgerBusy: false, qrImageOk: false,
  invPrefixDraft: "", invSeqDraft: "",
};

function setState(patch) {
  Object.assign(state, typeof patch === "function" ? patch(state) : patch);
  render();
}

function showToast(text) {
  state.toast = text;
  render();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { state.toast = ""; render(); }, 4000);
}

function logout(message) {
  localStorage.removeItem(TOKEN_KEY);
  Object.assign(state, {
    token: null, booting: false, loginError: message || "", loginPw: "",
    orders: [], watchItems: [], customers: [], customerDetail: null, catalog: [], settings: null,
    resetCred: "", confirmResetPwId: null, resetPwInput: "",
    adminCurPw: "", adminNewPw: "", adminPwBusy: false,
  });
  render();
}

async function authedApi(path, opts) {
  try {
    return await api(path, Object.assign({ token: state.token }, opts));
  } catch (err) {
    if (err instanceof ApiError && err.status === 401) logout("Session expired — please sign in again");
    throw err;
  }
}
async function authedDownload(path, filename) {
  try {
    await apiDownload(path, state.token, filename);
  } catch (err) {
    if (err instanceof ApiError && err.status === 401) { logout("Session expired — please sign in again"); return; }
    showToast(errorMessage(err));
  }
}

function fmtToday() {
  const d = new Date();
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return days[d.getDay()] + " " + d.getDate() + " " + months[d.getMonth()] + " " + d.getFullYear();
}
function num(v, fb) {
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ""));
  return isFinite(n) ? n : (fb || 0);
}

/* ------------------------------------------------------------ data loads */

async function doLogin() {
  if (!state.loginUser.trim() || !state.loginPw) { setState({ loginError: "Enter the admin username and password" }); return; }
  setState({ loginBusy: true, loginError: "" });
  try {
    const res = await api("/api/admin/login", { method: "POST", json: { username: state.loginUser.trim(), password: state.loginPw } });
    localStorage.setItem(TOKEN_KEY, res.token);
    Object.assign(state, { token: res.token, loginBusy: false, loginUser: "", loginPw: "" });
    render();
    bootAuthed();
  } catch (err) {
    setState({ loginBusy: false, loginError: errorMessage(err) || "Invalid admin credentials" });
  }
}

async function bootAuthed() {
  try {
    await switchTab(state.tab, true);
  } catch (err) {
    if (!(err instanceof ApiError && err.status === 401)) showToast(errorMessage(err));
  } finally {
    state.booting = false;
    render();
  }
}

async function loadOrders() {
  state.orders = await authedApi("/api/orders");
  if (state.selectedPoId == null && state.orders.length) state.selectedPoId = state.orders[0].id;
}
async function loadWatchItems() {
  state.watchItems = await authedApi("/api/items?daily_only=true");
}
async function loadCustomers() {
  state.customers = await authedApi("/api/admin/customers");
  if (state.selectedCustomerId == null && state.customers.length) state.selectedCustomerId = state.customers[0].id;
  if (state.selectedCustomerId != null) await loadCustomerDetail(state.selectedCustomerId);
}
async function loadCustomerDetail(id) {
  state.customerDetail = await authedApi("/api/admin/customers/" + id);
}
async function loadCatalog() {
  const params = new URLSearchParams();
  if (state.catQ.trim()) params.set("q", state.catQ.trim());
  state.catalog = await authedApi("/api/items?" + params.toString());
}
async function loadSettings() {
  state.settings = await authedApi("/api/settings");
  state.invPrefixDraft = state.settings.invoice_prefix;
  state.invSeqDraft = String(state.settings.invoice_next_seq);
}
async function loadLedger() {
  state.ledgerBusy = true;
  const customers = state.customers.length ? state.customers : await authedApi("/api/admin/customers");
  state.customers = customers;
  const details = await Promise.all(customers.map(c => authedApi("/api/admin/customers/" + c.id).catch(() => null)));
  state.ledgerRows = customers.map((c, i) => ({
    name: c.name || "(no name on record)",
    billed: (details[i] && details[i].lifetime_billed) || 0,
    due: c.balance_due || 0,
  }));
  state.ledgerBusy = false;
}
function checkQr() {
  if (!state.settings || !state.settings.upi_qr_path) { state.qrImageOk = false; return; }
  const img = new Image();
  img.onload = () => { state.qrImageOk = true; render(); };
  img.onerror = () => { state.qrImageOk = false; render(); };
  img.src = "/" + state.settings.upi_qr_path + "?_=" + Date.now();
}

async function switchTab(tab, force) {
  state.tab = tab;
  render();
  try {
    if (tab === "dash") await Promise.all([loadOrders(), loadWatchItems()]);
    else if (tab === "orders" || tab === "invoices") await loadOrders();
    else if (tab === "customers") await loadCustomers();
    else if (tab === "catalog") await loadCatalog();
    else if (tab === "ocr") { /* nothing to preload */ }
    else if (tab === "reports") { await loadSettings(); checkQr(); await loadLedger(); }
  } catch (err) {
    if (!(err instanceof ApiError && err.status === 401)) showToast(errorMessage(err));
  }
  render();
}

/* ------------------------------------------------------------- mutations */

async function patchItem(id, patch, reload) {
  try {
    await authedApi("/api/items/" + id, { method: "PATCH", json: patch });
    if (reload) await reload();
    render();
  } catch (err) { showToast(errorMessage(err)); render(); }
}

function resetNewItemForm(patch) {
  Object.assign(state, {
    newItemName: "", newItemCategory: "", newItemBrand: "", newItemSize: "", newItemCase: "1",
    newItemMrp: "", newItemTaxable: "", newItemGst: "5", newItemTaxType: "Exclusive",
    newItemPromo: "", newItemDisc: "0", newItemDaily: false, newItemAisle: "", newItemHsn: "",
    addItemOpen: false, addItemBusy: false,
  }, patch || {});
}

async function createItemManual() {
  const name = state.newItemName.trim();
  if (!name) { showToast("Item name is required"); return; }
  const payload = {
    item_name: name,
    category: state.newItemCategory.trim() || null,
    brand: state.newItemBrand.trim() || null,
    item_size: state.newItemSize.trim() || null,
    case_size: Math.max(Math.round(num(state.newItemCase, 1)), 1),
    mrp: num(state.newItemMrp, 0),
    taxable_value: num(state.newItemTaxable, 0),
    total_gst_rate: num(state.newItemGst, 0),
    tax_type: state.newItemTaxType,
    promo_status: state.newItemPromo,
    discount_rate: num(state.newItemDisc, 0),
    is_daily_rate_change: state.newItemDaily,
    aisle: state.newItemAisle.trim() || null,
    hsn_code: state.newItemHsn.trim() || null,
  };
  setState({ addItemBusy: true });
  try {
    await authedApi("/api/items", { method: "POST", json: payload });
    showToast(name + " added to the item master");
    resetNewItemForm();
    await loadCatalog();
    render();
  } catch (err) {
    setState({ addItemBusy: false });
    showToast(errorMessage(err));
  }
}

function armDeleteItem(id) {
  state.confirmDeleteItemId = Number(id);
  render();
  clearTimeout(armDeleteItem._t);
  armDeleteItem._t = setTimeout(() => {
    if (state.confirmDeleteItemId === Number(id)) { state.confirmDeleteItemId = null; render(); }
  }, 4000);
}
async function confirmDeleteItem(id) {
  state.confirmDeleteItemId = null;
  try {
    await authedApi("/api/items/" + id, { method: "DELETE" });
    showToast("Item deleted from the item master");
    await Promise.all([loadCatalog(), loadWatchItems().catch(() => {})]);
    render();
  } catch (err) { showToast(errorMessage(err)); render(); }
}

function pickImageFor(itemId) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.style.display = "none";
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    const fd = new FormData(); fd.append("file", f);
    try {
      await authedApi("/api/items/" + itemId + "/image", { method: "POST", form: fd });
      showToast("Image saved to static/images/ · " + f.name);
      await Promise.all([loadWatchItems().catch(() => {}), loadCatalog().catch(() => {})]);
      render();
    } catch (err) { showToast(errorMessage(err)); }
  });
  document.body.appendChild(inp);
  inp.click();
}

async function patchOrderLines(poId, body) {
  try {
    await authedApi("/api/orders/" + poId, { method: "PATCH", json: body });
    await loadOrders();
    render();
  } catch (err) { showToast(errorMessage(err)); render(); }
}
function addCustomLine() {
  const name = state.customName.trim();
  if (!name) { showToast("Custom line needs a name"); return; }
  const po = selectedFrom(pendingOrders());
  if (!po) return;
  patchOrderLines(po.id, {
    add_custom_lines: [{ custom_name: name, qty: Math.max(num(state.customQty, 1), 0.01), rate_override: num(state.customRate, 0), gst_override: num(state.customGst, 0) }],
  });
  setState({ customName: "", customQty: "1", customRate: "" });
}
function startVoiceFieldInput(target) {
  if (state.voiceListeningFor) return;
  startVoiceInput({
    lang: "en-IN",
    onStart: () => { state.voiceListeningFor = target; render(); },
    onEnd: () => { state.voiceListeningFor = null; render(); },
    onResult: text => {
      if (!text) return;
      if (target === "catQ") { state.catQ = text; render(); loadCatalog().then(render); }
      else if (target === "itemSearchQ") { searchItemsForPo(text); }
    },
    onError: err => { state.voiceListeningFor = null; render(); showToast(errorMessage(err)); },
  });
}
async function searchItemsForPo(q) {
  state.itemSearchQ = q;
  if (!q.trim()) { state.itemSearchResults = []; state.itemSearchBusy = false; render(); return; }
  state.itemSearchBusy = true;
  render();
  try {
    const results = await authedApi("/api/items?" + new URLSearchParams({ q: q.trim() }).toString());
    if (state.itemSearchQ === q) { state.itemSearchResults = results.slice(0, 8); state.itemSearchBusy = false; render(); }
  } catch (err) {
    if (state.itemSearchQ === q) { state.itemSearchBusy = false; render(); }
    showToast(errorMessage(err));
  }
}
function addItemLine(itemId) {
  const po = selectedFrom(pendingOrders());
  if (!po) return;
  patchOrderLines(po.id, { add_item_lines: [{ item_id: Number(itemId), qty: 1 }] });
  setState({ itemSearchQ: "", itemSearchResults: [] });
}
async function billOrder(poId) {
  try {
    const res = await authedApi("/api/orders/" + poId + "/bill", { method: "POST" });
    showToast(res.po_number + " locked as " + res.invoice_number + " · revenue and ledger updated — moved to Invoices");
    state.selectedPoId = poId;
    state.tab = "invoices";
    await loadOrders();
    render();
  } catch (err) { showToast(errorMessage(err)); render(); }
}

function armDeletePo(id) {
  state.confirmDeletePoId = Number(id);
  render();
  clearTimeout(armDeletePo._t);
  armDeletePo._t = setTimeout(() => {
    if (state.confirmDeletePoId === Number(id)) { state.confirmDeletePoId = null; render(); }
  }, 4000);
}
async function confirmDeletePo(id) {
  state.confirmDeletePoId = null;
  try {
    const res = await authedApi("/api/orders/" + id, { method: "DELETE" });
    showToast((res.invoice_number ? res.invoice_number + " / " : "") + res.po_number + " deleted");
    if (state.selectedPoId === Number(id)) state.selectedPoId = null;
    await loadOrders();
    render();
  } catch (err) { showToast(errorMessage(err)); render(); }
}

async function recordPayment(customerId) {
  const amt = num(state.paymentAmount, 0);
  if (amt <= 0) { showToast("Enter a payment amount greater than zero"); return; }
  try {
    await authedApi("/api/admin/customers/" + customerId + "/payments", { method: "POST", json: { amount: amt, note: state.paymentNote.trim() || null } });
    setState({ paymentAmount: "", paymentNote: "" });
    await Promise.all([loadCustomers(), loadCustomerDetail(customerId)]);
    showToast("Payment recorded");
    render();
  } catch (err) { showToast(errorMessage(err)); render(); }
}

function armResetPw(id) {
  state.confirmResetPwId = Number(id);
  state.resetPwInput = "";
  render();
  clearTimeout(armResetPw._t);
  armResetPw._t = setTimeout(() => {
    if (state.confirmResetPwId === Number(id)) { state.confirmResetPwId = null; state.resetPwInput = ""; render(); }
  }, 20000);
}
async function confirmResetPw(id) {
  state.confirmResetPwId = null;
  const chosen = state.resetPwInput.trim();
  try {
    const res = await authedApi("/api/admin/customers/" + id + "/reset-password", { method: "POST", json: { password: chosen || null } });
    setState({ resetPwInput: "", resetCred: "id: " + res.cust_code + "\nnew password: " + res.password });
    showToast("New password set for " + res.cust_code + " — give it to them now, it won't be shown again");
  } catch (err) { showToast(errorMessage(err)); render(); }
}

async function createCustomer() {
  try {
    const res = await authedApi("/api/admin/customers", {
      method: "POST",
      json: { name: state.newName.trim() || null, phone: state.newPhone.trim() || null, password: state.newPassword.trim() || null },
    });
    setState({
      newName: "", newPhone: "", newPassword: "",
      newCred: "id: " + res.cust_code + "\npassword: " + res.password + "\nname: " + (res.name || "(no name on record)") + "\nphone: " + (res.phone || "null"),
    });
    showToast(res.cust_code + " created");
    await loadCustomers();
    render();
  } catch (err) { showToast(errorMessage(err)); render(); }
}

async function changeAdminPassword() {
  const current = state.adminCurPw;
  const next = state.adminNewPw.trim();
  if (!current || !next) { showToast("Enter your current and new password"); return; }
  setState({ adminPwBusy: true });
  try {
    await authedApi("/api/admin/change-password", { method: "POST", json: { current_password: current, new_password: next } });
    setState({ adminPwBusy: false, adminCurPw: "", adminNewPw: "" });
    showToast("Admin password updated — use it next time you sign in");
  } catch (err) { setState({ adminPwBusy: false }); showToast(errorMessage(err)); }
}

async function runImportDryRun(file) {
  setState({ importBusy: true });
  const fd = new FormData(); fd.append("file", file);
  try {
    const res = await authedApi("/api/items/import?dry_run=true", { method: "POST", form: fd });
    setState({ importBusy: false, importResult: res });
  } catch (err) { setState({ importBusy: false }); showToast(errorMessage(err)); }
}
async function commitImport() {
  if (!state.importFile) return;
  setState({ importBusy: true });
  const fd = new FormData(); fd.append("file", state.importFile);
  try {
    const res = await authedApi("/api/items/import?dry_run=false", { method: "POST", form: fd });
    showToast(res.committed + " rows committed · " + res.new_skus + " new SKUs queued for background image fetch");
    await loadCatalog();
    setState({ importBusy: false, importOpen: false, importFile: null, importFileName: "", importResult: null });
  } catch (err) { setState({ importBusy: false }); showToast(errorMessage(err)); }
}

function pickOcrFile() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.style.display = "none";
  inp.addEventListener("change", () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (f) setState({ ocrFile: f, ocrFileName: f.name, ocrState: "idle", ocrError: "" });
  });
  document.body.appendChild(inp);
  inp.click();
}
async function runOcr() {
  if (!state.ocrFile) { pickOcrFile(); return; }
  setState({ ocrState: "busy" });
  const fd = new FormData(); fd.append("file", state.ocrFile);
  try {
    const res = await authedApi("/api/ocr/parchi", { method: "POST", form: fd });
    if (!res.success) { setState({ ocrState: "failed", ocrError: res.reason || "could not read this parchi" }); return; }
    const floor = res.confidence_floor != null ? res.confidence_floor : 0.6;
    setState({
      ocrState: "done",
      ocrRows: res.lines.map(l => Object.assign({}, l, { on: l.matched_item_id != null && l.confidence >= floor, floor })),
    });
  } catch (err) { setState({ ocrState: "failed", ocrError: errorMessage(err) }); }
}
function resetOcr() {
  setState({ ocrFile: null, ocrFileName: "", ocrState: "idle", ocrError: "", ocrRows: [] });
}
async function acceptOcrDraft() {
  const accepted = state.ocrRows.filter(r => r.on && r.matched_item_id);
  const unlisted = state.ocrRows.filter(r => !(r.on && r.matched_item_id)).map(r => r.raw_text).join("\n");
  try {
    const res = await authedApi("/api/ocr/parchi/confirm", {
      method: "POST",
      json: { lines: accepted.map(r => ({ item_id: r.matched_item_id, qty: r.qty })), unlisted_text: unlisted, customer_id: null, utr: null },
    });
    showToast(res.po_number + " created from parchi · " + accepted.length + " lines");
    resetOcr();
    state.selectedPoId = res.id;
    await switchTab("orders", true);
  } catch (err) { showToast(errorMessage(err)); render(); }
}

async function patchSettings(patch) {
  try {
    state.settings = await authedApi("/api/settings", { method: "PATCH", json: patch });
    render();
  } catch (err) { showToast(errorMessage(err)); render(); }
}
function pickQrFile() {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.style.display = "none";
  inp.addEventListener("change", async () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    const fd = new FormData(); fd.append("file", f);
    try {
      await authedApi("/api/settings/upi-qr", { method: "POST", form: fd });
      await loadSettings();
      checkQr();
      showToast("UPI QR replaced · " + f.name);
      render();
    } catch (err) { showToast(errorMessage(err)); }
  });
  document.body.appendChild(inp);
  inp.click();
}

/* ------------------------------------------------------------- selectors */

function selectedFrom(list) {
  return list.filter(o => o.id === state.selectedPoId)[0] || list[0] || null;
}
function pendingOrders() { return state.orders.filter(o => o.status !== "BILLED"); }
function billedOrders() { return state.orders.filter(o => o.status === "BILLED"); }
function selectedCustomer() {
  return state.customers.filter(c => c.id === state.selectedCustomerId)[0] || null;
}
function thumbHtml(item) {
  if (item.image_path) return '<div class="thumb"><img src="/' + esc(item.image_path) + '" onerror="this.parentElement.classList.add(\'noimg\')"></div>';
  return '<div class="thumb"></div>';
}
function statusColor(s) { return s === "BILLED" ? "#ae1800" : "rgba(32,30,29,.55)"; }
function timeOf(createdAt) {
  const m = /\d{2}:\d{2}/.exec(createdAt || "");
  return m ? m[0] : (createdAt || "");
}

/* ------------------------------------------------------------------ render */

function render() {
  const app = document.getElementById("app");
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if (active && app.contains(active) && active.id) { focusId = active.id; selStart = active.selectionStart; selEnd = active.selectionEnd; }
  app.innerHTML = state.booting ? '<div style="padding:80px;text-align:center" class="mono">Loading admin session…</div>' : (!state.token ? loginTpl() : shellTpl());
  wire();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) { el.focus(); if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (err) {} } }
  }
}

  const custCount = new Set(orders.map(o => o.customer_id)).size;
  const tiles = [
    { label: "Today's sale (billed)", value: inr0(daySale), note: billed.length + " locked tax invoice" + (billed.length === 1 ? "" : "s") },

    { label: "Converted to bills", value: String(billed.length), note: orders.length ? billed.length + " of " + orders.length + " · " + Math.round(billed.length / orders.length * 100) + "%" : "no orders yet" },
    { label: "Pending POs", value: String(pending.length), note: pending.length ? "oldest " + timeOf(pending[pending.length - 1].created_at) : "queue clear" },

        <button data-action="closeAddItem" style="padding:9px 13px;font-size:13px;font-weight:800;background:transparent;color:#201e1d;border:1px solid rgba(32,30,29,.4);cursor:pointer">Cancel</button>

    </div>` : ""}

    ${st.importOpen ? `
    <div style="border:2px solid rgba(32,30,29,.4);margin-bottom:18px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(32,30,29,.4)">
        <div style="font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase">CSV import${st.importResult ? " — dry run" : ""}</div>
        <button data-action="closeImport" style="width:28px;height:28px;display:grid;place-items:center;background:transparent;border:1px solid rgba(32,30,29,.4);cursor:pointer;color:#201e1d">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
      </div>
      ${!st.importFileName ? `
      <div style="padding:20px 16px">
        <button data-action="pickImportFile" style="padding:10px 14px;font-size:13px;font-weight:800;background:#201e1d;color:#f3f2f2;border:0;cursor:pointer">Choose CSV file…</button>
      </div>` : st.importBusy ? `<div class="mono" style="padding:20px 16px;font-size:12px">Reading ${esc(st.importFileName)}…</div>` : !st.importResult ? "" : `
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:rgba(32,30,29,.4)">
        ${[["Valid", st.importResult.valid_rows], ["Flagged", st.importResult.warnings.length], ["New SKUs", st.importResult.new_skus], ["File", st.importFileName]].map(s => `
        <div style="background:#f3f2f2;padding:14px 16px">
          <div class="mono" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(32,30,29,.55);margin-bottom:6px">${s[0]}</div>
          <div style="font-size:${s[0] === "File" ? "13px" : "26px"};font-weight:800">${esc(String(s[1]))}</div>
        </div>`).join("")}
      </div>
      <div style="padding:14px 16px;border-top:1px solid rgba(32,30,29,.4)">
        <div class="mono" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#ae1800;margin-bottom:8px">Row warnings — import continues, flagged rows skipped</div>
        ${st.importResult.warnings.length ? st.importResult.warnings.map(w => `<div class="mono" style="font-size:12px;line-height:1.7;border-top:1px solid rgba(32,30,29,.4);padding:5px 0">row ${w.row} · ${esc(w.message)}</div>`).join("") : `<div class="mono" style="font-size:12px;color:rgba(32,30,29,.55)">none</div>`}
        <div style="display:flex;gap:8px;margin-top:14px">
          <button data-action="commitImport" ${st.importBusy ? "disabled" : ""} style="padding:9px 13px;font-size:13px;font-weight:800;background:#ec3013;color:#f3f2f2;border:0;cursor:pointer">Commit ${st.importResult.valid_rows} valid rows</button>
          <button data-action="closeImport" style="padding:9px 13px;font-size:13px;font-weight:800;background:transparent;color:#201e1d;border:1px solid rgba(32,30,29,.4);cursor:pointer">Cancel</button>
        </div>
      </div>`}
    </div>` : ""}

    <div style="display:grid;grid-template-columns:44px 1fr 130px 110px 84px 66px 84px 84px 56px 130px 66px 106px 132px;border-top:2px solid rgba(32,30,29,.4)">
      ${catHeads.map(h => `<div style="${h[1]}">${h[0]}</div>`).join("")}
      ${st.catalog.map(it => `
      <div style="padding:6px 6px 6px 0;border-bottom:1px solid rgba(32,30,29,.4);display:flex;align-items:center">${thumbHtml(it)}</div>
      <div style="padding:7px 8px 7px 0;border-bottom:1px solid rgba(32,30,29,.4)">
        <div style="font-size:13px;font-weight:800;line-height:1.25">${esc(it.item_name)}</div>
        <div class="mono" style="font-size:10px;color:rgba(32,30,29,.55)">image: ${it.image_source === "manual" ? "manual upload" : it.image_source === "auto" ? "auto-fetched" : "fetch failed — placeholder"}</div>
      </div>
      <div class="mono" style="padding:7px 8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:11px;color:rgba(32,30,29,.7)">${esc(it.category || "")}</div>
      <div class="mono" style="padding:7px 8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:11px;color:rgba(32,30,29,.7)">${esc(it.brand || "")}</div>
      <div class="mono" style="padding:7px 8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:11px;color:rgba(32,30,29,.7)">${esc(it.item_size || "")}</div>
      <div class="mono" style="padding:7px 8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:11px;text-align:right;color:rgba(32,30,29,.7)">${it.case_size}</div>
      <div class="mono" style="padding:7px 8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:12px;text-align:right">${inr0(it.mrp)}</div>
      <div class="mono" style="padding:7px 8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:12px;text-align:right">${it.taxable_value.toFixed(2)}</div>
      <div class="mono" style="padding:7px 8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:12px;text-align:right">${it.total_gst_rate}%</div>
      <div class="mono" style="padding:7px 8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:11px;color:rgba(32,30,29,.7)">${it.tax_type === "Inclusive_MRP" ? "incl. MRP" : "excl."}</div>
      <div class="mono" style="padding:7px 8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:12px;text-align:right">${it.discount_rate ? it.discount_rate + "%" : "—"}</div>
      <div style="padding:7px 8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:13px;font-weight:800;text-align:right">${inr(it.pricing.selling)}</div>
      <div style="padding:5px 6px 5px 8px;border-bottom:1px solid rgba(32,30,29,.4);display:flex;align-items:center;gap:4px">
        <button data-action="toggleDaily" data-id="${it.id}" title="Is_Daily_Rate_Change" style="flex:none;width:26px;height:26px;display:grid;place-items:center;font-size:11px;font-weight:800;cursor:pointer;border:1px solid rgba(32,30,29,.4);${it.is_daily_rate_change ? "background:#ec3013;color:#f3f2f2;border-color:#ec3013;" : "background:transparent;color:rgba(32,30,29,.45);"}">D</button>
        <button data-action="uploadImage" data-id="${it.id}" title="Upload image" style="flex:1;padding:4px 4px;font-size:10px;font-weight:800;background:transparent;color:#201e1d;border:1px solid rgba(32,30,29,.4);cursor:pointer">IMG</button>
        ${st.confirmDeleteItemId === it.id
          ? `<button data-action="confirmDeleteItem" data-id="${it.id}" title="Click to confirm delete" style="flex:none;padding:4px 6px;font-size:10px;font-weight:800;background:#ec3013;color:#f3f2f2;border:1px solid #ec3013;cursor:pointer">Sure?</button>`
          : `<button data-action="deleteItem" data-id="${it.id}" title="Delete item" style="flex:none;width:26px;height:26px;display:grid;place-items:center;background:transparent;border:1px solid rgba(32,30,29,.4);cursor:pointer;color:#ec3013">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"></path></svg>
            </button>`}
      </div>`).join("")}
    </div>
  </div>`;
}

function ocrTpl() {
  const st = state;
  const floor = st.ocrRows.length ? st.ocrRows[0].floor : 0.6;
  const accepted = st.ocrRows.filter(r => r.on && r.matched_item_id);

  return `
  <div style="display:grid;grid-template-columns:420px 1fr;gap:2px;background:rgba(32,30,29,.4);min-height:760px">
    <div style="background:#f3f2f2;padding:22px 24px 32px">
      <div style="font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px">Handwritten parchi</div>
      <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-bottom:14px">Local OCR · pytesseract + OpenCV · no network call</div>

      <div data-action="pickOcrFile" style="cursor:pointer;border:2px solid rgba(32,30,29,.4);background:repeating-linear-gradient(135deg,#e9e6e6 0 7px,#dedada 7px 14px);height:300px;display:grid;place-items:center;margin-bottom:12px">
        <div style="text-align:center;padding:0 24px">
          <div class="mono" style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#605d5d">${st.ocrFileName ? esc(st.ocrFileName) + " — click to change" : "click to choose a parchi photo — jpg, png"}</div>
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-bottom:16px">
        <button data-action="runOcr" ${st.ocrState === "busy" ? "disabled" : ""} style="flex:1;text-align:left;padding:11px 14px;font-size:13px;font-weight:800;background:#ec3013;color:#f3f2f2;border:0;cursor:pointer">${st.ocrState === "busy" ? "Reading…" : (st.ocrState === "idle" ? "Run local OCR" : "Re-run OCR")}</button>
        <button data-action="resetOcr" style="flex:none;padding:11px 14px;font-size:13px;font-weight:800;background:transparent;color:#201e1d;border:1px solid rgba(32,30,29,.4);cursor:pointer">Reset</button>
      </div>
      <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);line-height:1.6">A failed read alerts the admin and leaves the draft untouched — never a server error.</div>
    </div>

    <div style="background:#f3f2f2;padding:22px 32px 40px">
      ${st.ocrState === "idle" || st.ocrState === "busy" ? `
      <div style="max-width:520px;padding-top:60px">
        <div style="font-size:32px;font-weight:800;letter-spacing:-0.02em;margin-bottom:10px">${st.ocrState === "busy" ? "Reading the parchi…" : "No parchi processed yet"}</div>
        <div style="font-size:14px;color:rgba(32,30,29,.7);line-height:1.7">Drop a photo of the shop's handwritten list. Extracted lines are fuzzy-matched against the item master, then land here as an editable draft PO for review before anything is saved.</div>
      </div>` : ""}

      ${st.ocrState === "failed" ? `
      <div style="max-width:560px;padding-top:40px">
        <div style="background:#ec3013;color:#f3f2f2;padding:20px 22px;margin-bottom:18px">
          <div class="mono" style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.85;margin-bottom:8px">OCR failed — nothing was saved</div>
          <div style="font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1.1">Could not read this parchi</div>
        </div>
        <div class="mono" style="font-size:12px;line-height:1.8;margin-bottom:18px">${esc(st.ocrError)}</div>
        <div style="display:flex;gap:8px">
          <button data-action="resetOcr" style="padding:10px 14px;font-size:13px;font-weight:800;background:#201e1d;color:#f3f2f2;border:0;cursor:pointer">Re-upload a clearer photo</button>
          <button data-action="tab" data-tab="orders" style="padding:10px 14px;font-size:13px;font-weight:800;background:transparent;color:#201e1d;border:1px solid rgba(32,30,29,.4);cursor:pointer">Enter the order by hand</button>
        </div>
      </div>` : ""}

      ${st.ocrState === "done" ? `
      <div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:2px solid rgba(32,30,29,.4);padding-bottom:14px;margin-bottom:16px">
          <div>
            <div style="font-size:32px;font-weight:800;letter-spacing:-0.02em">Draft from parchi</div>
            <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-top:4px">${st.ocrRows.length} tokens extracted · ${st.ocrRows.filter(r => r.confidence >= floor).length} above the ${floor.toFixed(2)} confidence floor</div>
          </div>
          <button data-action="acceptOcrDraft" ${accepted.length === 0 ? "disabled" : ""} style="padding:10px 14px;font-size:13px;font-weight:800;background:#ec3013;color:#f3f2f2;border:0;cursor:pointer;${accepted.length === 0 ? "opacity:.45;" : ""}">Create PO from ${accepted.length} matched lines</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 74px 96px 120px;border-top:2px solid rgba(32,30,29,.4)">
          <div style="${HEAD_STYLE}">Extracted text</div>
          <div style="${HEAD_STYLE}">Fuzzy match</div>
          <div style="${HEAD_R}">Conf.</div>
          <div style="${HEAD_R}">Qty</div>
          <div style="${HEAD_STYLE}">In draft</div>
          ${st.ocrRows.map((r, i) => `
          <div class="mono" style="padding:9px 8px 9px 0;border-bottom:1px solid rgba(32,30,29,.4);font-size:13px;color:rgba(32,30,29,.7)">"${esc(r.raw_text)}"</div>
          <div style="padding:8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:13px;font-weight:800">${esc(r.matched_item_name || "no match — keep as unlisted")}</div>
          <div class="mono" style="padding:9px 8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:12px;text-align:right;color:${r.confidence >= floor ? "#201e1d" : "#ae1800"}">${r.confidence.toFixed(2)}</div>
          <div style="padding:5px 6px;border-bottom:1px solid rgba(32,30,29,.4);display:flex;align-items:center">
            <input data-action="setOcrQty" data-idx="${i}" value="${r.qty}" class="mono" style="width:100%;min-height:30px;padding:4px 7px;font-size:13px;text-align:right;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0;color:#201e1d;caret-color:#ec3013"/>
          </div>
          <div style="padding:5px 0 5px 8px;border-bottom:1px solid rgba(32,30,29,.4);display:flex;align-items:center">
            <button data-action="toggleOcrRow" data-idx="${i}" style="width:100%;padding:5px 8px;font-size:11px;font-weight:800;text-align:left;cursor:pointer;border:1px solid rgba(32,30,29,.4);${r.on ? "background:#201e1d;color:#f3f2f2;border-color:#201e1d;" : "background:transparent;color:rgba(32,30,29,.45);"}">${r.on ? "Included" : "Excluded"}</button>
          </div>`).join("")}
        </div>
        <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-top:12px;line-height:1.7">Lines below the ${floor.toFixed(2)} confidence floor are excluded by default and must be accepted deliberately. Unmatched or excluded tokens carry into the PO as unlisted requests.</div>
      </div>` : ""}
    </div>
  </div>`;
}

function reportsTpl() {
  const st = state;
  const s = st.settings || { po_auto_purge_days: 30, invoice_prefix: "INV-", invoice_next_seq: 1001, upi_qr_path: "", ocr_confidence_floor: 0.6 };
  const reportDefs = [
    { name: "Item-wise sales", cols: "item_name, category, qty_sold, taxable_value, cgst, sgst, total_value", path: "/api/reports/item-wise-sales.csv", file: "item_wise_sales.csv" },
    { name: "Customer-wise sales", cols: "customer_id, customer_name, bills, taxable_value, total_gst, total_value", path: "/api/reports/customer-wise-sales.csv", file: "customer_wise_sales.csv" },
    { name: "Customer-wise outstanding", cols: "customer_id, customer_name, billed_to_date, paid, balance_due", path: "/api/reports/customer-outstanding.csv", file: "customer_outstanding.csv" },
  ];

  return `
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:2px;background:rgba(32,30,29,.4)">
    <div style="background:#f3f2f2;padding:24px 32px 36px">
      <div style="font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px">Day-end reports</div>
      <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-bottom:18px">Generated from locked sale bills only · CSV, UTF-8, comma-delimited</div>
      ${reportDefs.map(r => `
      <div style="border-top:1px solid rgba(32,30,29,.4);padding:14px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:20px">
        <div style="flex:1">
          <div style="font-size:17px;font-weight:800;margin-bottom:3px">${r.name}</div>
          <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);line-height:1.6">${r.cols}</div>
        </div>
        <button data-action="downloadReport" data-path="${r.path}" data-file="${r.file}" style="flex:none;display:flex;align-items:center;gap:7px;padding:9px 13px;font-size:13px;font-weight:800;background:transparent;color:#201e1d;border:1px solid rgba(32,30,29,.4);cursor:pointer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 11l5 5 5-5M4 21h16"></path></svg>
          Download
        </button>
      </div>`).join("")}

      <div style="border-top:2px solid rgba(32,30,29,.4);margin-top:20px;padding-top:20px">
        <div style="font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px">Outstanding ledger</div>
        <div style="display:grid;grid-template-columns:1fr 120px 120px;border-top:1px solid rgba(32,30,29,.4)">
          <div style="${HEAD_STYLE}">Customer</div>
          <div style="${HEAD_R}">Billed</div>
          <div style="${HEAD_R}">Balance due</div>
          ${st.ledgerBusy ? `<div class="mono" style="grid-column:1/-1;padding:10px 0;font-size:12px;color:rgba(32,30,29,.55)">Loading…</div>` : st.ledgerRows.map(d => `
          <div style="padding:8px 8px 8px 0;border-bottom:1px solid rgba(32,30,29,.4);font-size:13px;font-weight:800">${esc(d.name)}</div>
          <div class="mono" style="padding:8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:12px;text-align:right;color:rgba(32,30,29,.55)">${inr0(d.billed)}</div>
          <div class="mono" style="padding:8px;border-bottom:1px solid rgba(32,30,29,.4);font-size:13px;text-align:right;color:${d.due ? "#ae1800" : "rgba(32,30,29,.55)"}">${d.due ? inr0(d.due) : "settled"}</div>`).join("")}
        </div>
      </div>
    </div>

    <div style="background:#f3f2f2;padding:24px 32px 36px">
      <div style="font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px">Store settings</div>

      <div style="border-top:1px solid rgba(32,30,29,.4);padding:16px 0">
        <div style="font-size:15px;font-weight:800;margin-bottom:2px">PO auto-purge</div>
        <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-bottom:10px">Unbilled POs older than this are deleted on startup. Locked sale bills are never purged.</div>
        <div style="display:flex;border:1px solid rgba(32,30,29,.4);max-width:340px">
          ${[0, 30, 60, 90].map(d => `<button data-action="setPurge" data-days="${d}" style="flex:1;padding:9px 10px;font-size:12px;font-weight:800;cursor:pointer;border:0;border-right:1px solid rgba(32,30,29,.4);${s.po_auto_purge_days === d ? "background:#201e1d;color:#f3f2f2;" : "background:transparent;color:#201e1d;"}">${d === 0 ? "Disabled" : d + " days"}</button>`).join("")}
        </div>
      </div>

      <div style="border-top:1px solid rgba(32,30,29,.4);padding:16px 0">
        <div style="font-size:15px;font-weight:800;margin-bottom:2px">Invoice numbering</div>
        <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-bottom:10px">Next invoice will be issued as ${esc(s.invoice_prefix)}${s.invoice_next_seq}</div>
        <div style="display:flex;gap:8px;max-width:340px">
          <input id="invPrefix" value="${esc(st.invPrefixDraft)}" class="mono" style="flex:1;min-height:34px;padding:5px 9px;font-size:13px;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0;color:#201e1d;caret-color:#ec3013"/>
          <input id="invSeq" value="${esc(st.invSeqDraft)}" class="mono" style="width:110px;min-height:34px;padding:5px 9px;font-size:13px;text-align:right;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0;color:#201e1d;caret-color:#ec3013"/>
        </div>
      </div>

      <div style="border-top:1px solid rgba(32,30,29,.4);padding:16px 0">
        <div style="font-size:15px;font-weight:800;margin-bottom:2px">UPI payment QR</div>
        <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-bottom:10px">Shown to every customer at checkout. Static image, no gateway.</div>
        <div style="display:flex;gap:14px;align-items:flex-start">
          <div style="width:112px;height:112px;flex:none;border:2px solid #201e1d;${st.qrImageOk ? "background-image:url(/" + esc(s.upi_qr_path) + ");background-size:cover;background-position:center;" : "background:repeating-linear-gradient(135deg,#e3e0e0 0 5px,#cfcbcb 5px 10px);"}display:grid;place-items:center">
            ${st.qrImageOk ? "" : `<span class="mono" style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#605d5d;text-align:center">no QR<br/>uploaded</span>`}
          </div>
          <div style="flex:1">
            <button data-action="pickQrFile" style="padding:9px 13px;font-size:13px;font-weight:800;background:transparent;color:#201e1d;border:1px solid rgba(32,30,29,.4);cursor:pointer;margin-bottom:8px">Upload QR image</button>
            <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);line-height:1.6">${st.qrImageOk ? "Live at checkout · stored as " + esc(s.upi_qr_path) : "Customers will see a placeholder until a QR is uploaded."}</div>
          </div>
        </div>
      </div>

      <div style="border-top:1px solid rgba(32,30,29,.4);padding:16px 0">
        <div style="font-size:15px;font-weight:800;margin-bottom:2px">Automatic image fetch</div>
        <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-bottom:10px">Runs in the background whenever a new item is created or imported — no API key.</div>
        <div class="mono" style="font-size:12px;line-height:1.8;background:#eae9e9;padding:12px 14px">Per-item status shows in the Catalogue tab as image: auto-fetched / manual upload / fetch failed — placeholder.</div>
      </div>

      <div style="border-top:1px solid rgba(32,30,29,.4);padding:16px 0">
        <div style="font-size:15px;font-weight:800;margin-bottom:2px">Create customer</div>
        <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-bottom:10px">Every field except the generated ID is optional and nullable — leave password blank for a random one.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:460px;margin-bottom:10px">
          <div>
            <label style="display:block;font-size:12px;margin-bottom:5px;color:rgba(32,30,29,.7)">Name (optional)</label>
            <input id="newName" value="${esc(st.newName)}" placeholder="leave blank" style="width:100%;min-height:34px;padding:5px 9px;font-size:13px;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0;color:#201e1d;caret-color:#ec3013"/>
          </div>
          <div>
            <label style="display:block;font-size:12px;margin-bottom:5px;color:rgba(32,30,29,.7)">Phone (optional)</label>
            <input id="newPhone" value="${esc(st.newPhone)}" placeholder="leave blank" class="mono" style="width:100%;min-height:34px;padding:5px 9px;font-size:13px;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0;color:#201e1d;caret-color:#ec3013"/>
          </div>
          <div style="grid-column:1/-1">
            <label style="display:block;font-size:12px;margin-bottom:5px;color:rgba(32,30,29,.7)">Password (optional — pick one they'll remember, or leave blank to auto-generate)</label>
            <input id="newPassword" value="${esc(st.newPassword)}" placeholder="leave blank for a random password" class="mono" style="width:100%;min-height:34px;padding:5px 9px;font-size:13px;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0;color:#201e1d;caret-color:#ec3013"/>
          </div>
        </div>
        <button data-action="createCustomer" style="padding:9px 13px;font-size:13px;font-weight:800;background:#201e1d;color:#f3f2f2;border:0;cursor:pointer">Create customer</button>
        ${st.newCred ? `<div class="mono" style="font-size:12px;line-height:1.8;background:#eae9e9;padding:12px 14px;margin-top:10px;border-left:2px solid #ec3013;white-space:pre-wrap">${esc(st.newCred)}</div>` : ""}
      </div>

      <div style="border-top:1px solid rgba(32,30,29,.4);padding:16px 0">
        <div style="font-size:15px;font-weight:800;margin-bottom:2px">Admin password</div>
        <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-bottom:10px">Replace the shared admin login password with one of your own.</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:460px;margin-bottom:10px">
          <div>
            <label style="display:block;font-size:12px;margin-bottom:5px;color:rgba(32,30,29,.7)">Current password</label>
            <input id="adminCurPw" type="password" value="${esc(st.adminCurPw)}" style="width:100%;min-height:34px;padding:5px 9px;font-size:13px;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0;color:#201e1d;caret-color:#ec3013"/>
          </div>
          <div>
            <label style="display:block;font-size:12px;margin-bottom:5px;color:rgba(32,30,29,.7)">New password</label>
            <input id="adminNewPw" type="password" value="${esc(st.adminNewPw)}" style="width:100%;min-height:34px;padding:5px 9px;font-size:13px;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0;color:#201e1d;caret-color:#ec3013"/>
          </div>
        </div>
        <button data-action="changeAdminPassword" style="padding:9px 13px;font-size:13px;font-weight:800;background:#201e1d;color:#f3f2f2;border:0;cursor:pointer">${st.adminPwBusy ? "Updating…" : "Update admin password"}</button>
      </div>
    </div>
  </div>`;
}

/* ------------------------------------------------------------------- wire */

function wire() {
  const app = document.getElementById("app");

  app.oninput = e => {
    const id = e.target.id;
    if (id === "loginUser") state.loginUser = e.target.value;
    else if (id === "loginPw") state.loginPw = e.target.value;
    else if (id === "customName") state.customName = e.target.value;
    else if (id === "customQty") state.customQty = e.target.value;
    else if (id === "customRate") state.customRate = e.target.value;
    else if (id === "customGst") state.customGst = e.target.value;
    else if (id === "paymentAmount") state.paymentAmount = e.target.value;
    else if (id === "paymentNote") state.paymentNote = e.target.value;
    else if (id === "newName") state.newName = e.target.value;
    else if (id === "newPhone") state.newPhone = e.target.value;
    else if (id === "newPassword") state.newPassword = e.target.value;
    else if (id === "resetPwInput") {
      state.resetPwInput = e.target.value;
      clearTimeout(armResetPw._t);
      if (state.confirmResetPwId != null) {
        const keepId = state.confirmResetPwId;
        armResetPw._t = setTimeout(() => {
          if (state.confirmResetPwId === keepId) { state.confirmResetPwId = null; state.resetPwInput = ""; render(); }
        }, 20000);
      }
    }
    else if (id === "adminCurPw") state.adminCurPw = e.target.value;
    else if (id === "adminNewPw") state.adminNewPw = e.target.value;
    else if (id === "invPrefix") state.invPrefixDraft = e.target.value;
    else if (id === "invSeq") state.invSeqDraft = e.target.value;
    else if (id === "catQ") {
      state.catQ = e.target.value;
      clearTimeout(wire._catDebounce);
      wire._catDebounce = setTimeout(() => loadCatalog().then(render), 280);
    }
    else if (id === "itemSearchQ") {
      state.itemSearchQ = e.target.value;
      render();
      clearTimeout(wire._itemSearchDebounce);
      wire._itemSearchDebounce = setTimeout(() => searchItemsForPo(state.itemSearchQ), 280);
    }
    else if (id === "newItemName") state.newItemName = e.target.value;
    else if (id === "newItemCategory") state.newItemCategory = e.target.value;
    else if (id === "newItemBrand") state.newItemBrand = e.target.value;
    else if (id === "newItemSize") state.newItemSize = e.target.value;
    else if (id === "newItemCase") state.newItemCase = e.target.value;
    else if (id === "newItemMrp") state.newItemMrp = e.target.value;
    else if (id === "newItemTaxable") state.newItemTaxable = e.target.value;
    else if (id === "newItemDisc") state.newItemDisc = e.target.value;
    else if (id === "newItemAisle") state.newItemAisle = e.target.value;
    else if (id === "newItemHsn") state.newItemHsn = e.target.value;
  };
  app.onchange = e => {
    const el = e.target;
    const action = el.getAttribute("data-action");
    if (action === "setMrp") patchItem(el.getAttribute("data-id"), { mrp: num(el.value, 0) }, loadWatchItems);
    else if (action === "setTaxable") patchItem(el.getAttribute("data-id"), { taxable_value: num(el.value, 0) }, loadWatchItems);
    else if (action === "setDisc") patchItem(el.getAttribute("data-id"), { discount_rate: Math.min(Math.max(num(el.value, 0), 0), 100) }, loadWatchItems);
    else if (action === "setLineQty") patchOrderLines(el.getAttribute("data-po"), { update_lines: [{ line_id: Number(el.getAttribute("data-line")), qty: Math.max(num(el.value, 0), 0) }] });
    else if (action === "setLineRate") patchOrderLines(el.getAttribute("data-po"), { update_lines: [{ line_id: Number(el.getAttribute("data-line")), rate_override: num(el.value, 0) }] });
    else if (action === "setOcrQty") { const i = Number(el.getAttribute("data-idx")); state.ocrRows[i].qty = Math.max(num(el.value, 0), 0); render(); }
    else if (el.id === "customGst") state.customGst = el.value;
    else if (el.id === "newItemGst") state.newItemGst = el.value;
    else if (el.id === "newItemTaxType") state.newItemTaxType = el.value;
    else if (el.id === "newItemPromo") state.newItemPromo = el.value;
    else if (el.id === "invPrefix" || el.id === "invSeq") {
      const patch = {};
      if (state.invPrefixDraft.trim()) patch.invoice_prefix = state.invPrefixDraft.trim();
      const seq = Math.max(num(state.invSeqDraft, 1), 1);
      patch.invoice_next_seq = seq;
      patchSettings(patch);
    }
  };
  app.onkeydown = e => {
    if (e.key === "Enter" && (e.target.id === "loginUser" || e.target.id === "loginPw")) doLogin();
    if (e.key === "Enter" && (e.target.id === "customName" || e.target.id === "customQty" || e.target.id === "customRate")) addCustomLine();
    if (e.key === "Enter" && (e.target.id === "adminCurPw" || e.target.id === "adminNewPw")) changeAdminPassword();
  };

  app.onclick = e => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.getAttribute("data-action");
    const id = btn.getAttribute("data-id");
    if (action === "login") doLogin();
    else if (action === "logout") logout();
    else if (action === "voiceInput") startVoiceFieldInput(btn.getAttribute("data-target"));
    else if (action === "tab") switchTab(btn.getAttribute("data-tab"));
    else if (action === "goOcr") switchTab("ocr");
    else if (action === "goImport") { switchTab("catalog").then(() => setState({ importOpen: true })); }
    else if (action === "openImport") setState({ importOpen: true, importResult: null, importFile: null, importFileName: "" });
    else if (action === "closeImport") setState({ importOpen: false, importResult: null, importFile: null, importFileName: "" });
    else if (action === "pickImportFile") {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".csv,text/csv"; inp.style.display = "none";
      inp.addEventListener("change", () => {
        const f = inp.files && inp.files[0]; inp.remove();
        if (!f) return;
        setState({ importFile: f, importFileName: f.name, importResult: null });
        runImportDryRun(f);
      });
      document.body.appendChild(inp); inp.click();
    }
    else if (action === "commitImport") commitImport();
    else if (action === "openAddItem") { resetNewItemForm({ addItemOpen: true }); render(); }
    else if (action === "closeAddItem") setState({ addItemOpen: false });
    else if (action === "toggleNewItemDaily") setState({ newItemDaily: !state.newItemDaily });
    else if (action === "createItemManual") createItemManual();
    else if (action === "deleteItem") armDeleteItem(id);
    else if (action === "confirmDeleteItem") confirmDeleteItem(id);
    else if (action === "uploadImage") pickImageFor(id);
    else if (action === "openOrder" || action === "openOrderFromHistory") {
      state.selectedPoId = Number(id);
      switchTab(btn.getAttribute("data-status") === "BILLED" ? "invoices" : "orders");
    }
    else if (action === "selectPo") setState({ selectedPoId: Number(id) });
    else if (action === "billOrder") billOrder(Number(id));
    else if (action === "deletePo") armDeletePo(id);
    else if (action === "confirmDeletePo") confirmDeletePo(id);
    else if (action === "removeLine") patchOrderLines(btn.getAttribute("data-po"), { remove_line_ids: [Number(btn.getAttribute("data-line"))] });
    else if (action === "addCustomLine") addCustomLine();
    else if (action === "addItemLine") addItemLine(id);
    else if (action === "downloadPicking") authedDownload("/api/orders/" + id + "/picking-sheet.pdf");
    else if (action === "downloadInvoice") authedDownload("/api/orders/" + id + "/invoice.pdf");
    else if (action === "downloadReport") authedDownload(btn.getAttribute("data-path"), btn.getAttribute("data-file"));
    else if (action === "selectCustomer") { state.selectedCustomerId = Number(id); state.resetCred = ""; loadCustomerDetail(Number(id)).then(render); render(); }
    else if (action === "recordPayment") recordPayment(Number(id));
    else if (action === "resetPw") armResetPw(id);
    else if (action === "confirmResetPw") confirmResetPw(id);
    else if (action === "createCustomer") createCustomer();
    else if (action === "changeAdminPassword") changeAdminPassword();
    else if (action === "toggleDaily") {
      const it = state.catalog.filter(x => x.id === Number(id))[0] || state.watchItems.filter(x => x.id === Number(id))[0];
      patchItem(id, { is_daily_rate_change: !(it && it.is_daily_rate_change) }, () => Promise.all([loadCatalog(), loadWatchItems()]));
    }
    else if (action === "pickOcrFile") pickOcrFile();
    else if (action === "runOcr") runOcr();
    else if (action === "resetOcr") resetOcr();
    else if (action === "toggleOcrRow") { const i = Number(btn.getAttribute("data-idx")); state.ocrRows[i].on = !state.ocrRows[i].on; render(); }
    else if (action === "acceptOcrDraft") acceptOcrDraft();
    else if (action === "setPurge") patchSettings({ po_auto_purge_days: Number(btn.getAttribute("data-days")) });
    else if (action === "pickQrFile") pickQrFile();
  };
}

render();
if (state.token) bootAuthed();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => { /* offline shell unavailable; app still works online */ });
  });
}
initPwaInstallPrompt({ appName: "Pilani Supply Co. — Admin", dismissKey: "pilani_pwa_dismiss_admin" });
</script>
</body>
</html>
