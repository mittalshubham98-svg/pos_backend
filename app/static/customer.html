<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilani Supply Co. — Customer</title>
<link rel="manifest" href="/static/customer-manifest.json">
<meta name="theme-color" content="#ec3013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pilani Supply">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@600&display=swap">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;background:#201e1d;font-family:"Archivo",system-ui,sans-serif;font-size:15px;line-height:1.55}
  a{color:#ec3013;text-underline-offset:3px}
  a:hover{color:#ae1800}
  h1,h2,h3,h4,h5,h6{margin:0;font-family:"Archivo",system-ui,sans-serif;font-weight:800;line-height:1.12;letter-spacing:-0.015em}
  input,textarea,button{font-family:inherit}
  :focus{outline:none}
  :focus-visible{outline:2px solid #ec3013;outline-offset:2px}
  ::selection{background:rgba(236,48,19,.3)}
  .noscroll::-webkit-scrollbar{width:0;height:0}
  .mono{font-family:'Archivo Narrow',monospace}
  @keyframes drawerUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .thumb{position:relative;height:88px;background:repeating-linear-gradient(135deg,#e3e0e0 0 6px,#d7d3d3 6px 12px);display:grid;place-items:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08)}
  .thumb span{font-family:'Archivo Narrow',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#605d5d;text-align:center;padding:0 6px}
</style>
</head>
<body>
<div style="min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:40px 16px;background:#201e1d">
<div id="app" style="width:430px;height:900px;background:#f3f2f2;color:#201e1d;position:relative;overflow:hidden;display:flex;flex-direction:column;border:2px solid #201e1d;box-shadow:0 12px 32px rgba(45,43,43,.22)"></div>
</div>

<script src="/static/api.js"></script>
<script>
const TOKEN_KEY = "pilani_customer_token";

const state = {
  token: localStorage.getItem(TOKEN_KEY) || null,
  custCode: null,
  loginId: "", loginPw: "", loginError: "", loginBusy: false,
  forgotOpen: false, forgotStep: "request", forgotId: "", forgotPhone: "", forgotOtp: "", forgotNewPw: "",
  forgotError: "", forgotBusy: false, forgotResult: null,
  accountOpen: false, curPw: "", newPw: "", pwError: "", pwBusy: false, pwDone: false,
  booting: !!localStorage.getItem(TOKEN_KEY),
  allItems: [], items: [], cats: ["All"], cat: "All", brands: ["All"], brand: "All", q: "", voiceListening: false,
  myOrders: [],
  cart: {}, unlisted: "", utr: "", cartOpen: false, orderError: "", placing: false,
  placed: null,
  toast: "",
  qrImageOk: false,
};

if (state.token) {
  const payload = decodeJwt(state.token);
  state.custCode = payload && payload.sub ? payload.sub : null;
}

function setState(patch) {
  Object.assign(state, typeof patch === "function" ? patch(state) : patch);
  render();
}

function showToast(text) {
  state.toast = text;
  render();
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { state.toast = ""; render(); }, 3500);
}

function logout(message) {
  localStorage.removeItem(TOKEN_KEY);
  Object.assign(state, {
    token: null, custCode: null, loginError: message || "", loginPw: "",
    allItems: [], items: [], myOrders: [], cart: {}, placed: null, booting: false,
    accountOpen: false, curPw: "", newPw: "", pwError: "", pwDone: false,
  });
  render();
}

async function authedApi(path, opts) {
  try {
    return await api(path, Object.assign({ token: state.token }, opts));
  } catch (err) {
    if (err instanceof ApiError && err.status === 401) {
      logout("Session expired — please sign in again");
    }
    throw err;
  }
}

async function loadAllItems() {
  const items = await authedApi("/api/items");
  state.allItems = items;
  const cats = Array.from(new Set(items.map(i => i.category).filter(Boolean))).sort();
  state.cats = ["All"].concat(cats);
  const brands = Array.from(new Set(items.map(i => i.brand).filter(Boolean))).sort();
  state.brands = ["All"].concat(brands);
}

async function refreshItems() {
  const params = new URLSearchParams();
  if (state.q.trim()) params.set("q", state.q.trim());
  if (state.cat !== "All") params.set("category", state.cat);
  if (state.brand !== "All") params.set("brand", state.brand);
  const items = await authedApi("/api/items?" + params.toString());
  state.items = items;
  render();
}

async function loadMyOrders() {
  try {
    state.myOrders = await authedApi("/api/customer/orders");
  } catch (err) { state.myOrders = []; }
}

function checkQr() {
  const img = new Image();
  img.onload = () => { state.qrImageOk = true; render(); };
  img.onerror = () => { state.qrImageOk = false; };
  img.src = "/static/images/upi_qr.png?_=" + Date.now();
}

async function bootAuthed() {
  try {
    await Promise.all([loadAllItems(), loadMyOrders()]);
    await refreshItems();
    checkQr();
  } catch (err) {
    if (!(err instanceof ApiError && err.status === 401)) showToast(errorMessage(err));
  } finally {
    state.booting = false;
    render();
  }
}

async function doLogin() {
  const id = state.loginId.trim().toUpperCase();
  const pw = state.loginPw;
  if (!id || !pw) { setState({ loginError: "Enter your customer ID and password" }); return; }
  setState({ loginBusy: true, loginError: "" });
  try {
    const res = await api("/api/customer/login", { method: "POST", json: { cust_code: id, password: pw } });
    localStorage.setItem(TOKEN_KEY, res.token);
    const payload = decodeJwt(res.token);
    Object.assign(state, { token: res.token, custCode: payload && payload.sub, loginBusy: false, loginId: "", loginPw: "" });
    render();
    bootAuthed();
  } catch (err) {
    setState({ loginBusy: false, loginError: errorMessage(err) || "ID or password not recognised" });
  }
}

function openForgot() {
  setState({
    forgotOpen: true, forgotStep: "request", forgotId: state.loginId, forgotPhone: "",
    forgotOtp: "", forgotNewPw: "", forgotError: "", forgotResult: null,
  });
}
function closeForgot() {
  setState({ forgotOpen: false, forgotStep: "request", forgotError: "", forgotResult: null, forgotBusy: false });
}
async function doRequestOtp() {
  const id = state.forgotId.trim().toUpperCase();
  const phone = state.forgotPhone.trim();
  if (!id || !phone) { setState({ forgotError: "Enter your customer ID and the mobile number on file" }); return; }
  setState({ forgotBusy: true, forgotError: "" });
  try {
    await api("/api/customer/otp/request", { method: "POST", json: { cust_code: id, phone } });
    setState({ forgotBusy: false, forgotStep: "verify" });
  } catch (err) {
    setState({ forgotBusy: false, forgotError: errorMessage(err) || "ID and mobile number don't match our records" });
  }
}
async function doResetWithOtp() {
  const id = state.forgotId.trim().toUpperCase();
  const phone = state.forgotPhone.trim();
  const otp = state.forgotOtp.trim();
  const newPassword = state.forgotNewPw.trim();
  if (!otp) { setState({ forgotError: "Enter the OTP the store gave you" }); return; }
  setState({ forgotBusy: true, forgotError: "" });
  try {
    const res = await api("/api/customer/otp/reset", {
      method: "POST",
      json: { cust_code: id, phone, otp, new_password: newPassword || null },
    });
    setState({ forgotBusy: false, forgotResult: res });
  } catch (err) {
    setState({ forgotBusy: false, forgotError: errorMessage(err) || "OTP is incorrect or has expired" });
  }
}

function openAccount() {
  setState({ accountOpen: true, cartOpen: false, curPw: "", newPw: "", pwError: "", pwDone: false });
}
function closeAccount() {
  setState({ accountOpen: false, curPw: "", newPw: "", pwError: "", pwDone: false });
}
async function doChangePassword() {
  const current = state.curPw;
  const next = state.newPw.trim();
  if (!current || !next) { setState({ pwError: "Enter your current and new password" }); return; }
  setState({ pwBusy: true, pwError: "" });
  try {
    await authedApi("/api/customer/change-password", { method: "POST", json: { current_password: current, new_password: next } });
    setState({ pwBusy: false, pwDone: true, curPw: "", newPw: "" });
  } catch (err) {
    setState({ pwBusy: false, pwError: errorMessage(err) || "Could not change password" });
  }
}

function bump(id, delta) {
  const cart = Object.assign({}, state.cart);
  const next = (cart[id] || 0) + delta;
  if (next <= 0) delete cart[id]; else cart[id] = next;
  setState({ cart });
}

function itemById(id) {
  return state.allItems.filter(x => String(x.id) === String(id))[0] || null;
}

function thumbHtml(it) {
  if (it.image_path) {
    return '<div class="thumb"><img src="/' + esc(it.image_path) + '" onerror="this.remove()">'
      + '<span style="position:absolute;inset:0;display:grid;place-items:center;background:repeating-linear-gradient(135deg,#e3e0e0 0 6px,#d7d3d3 6px 12px);z-index:-1">' + esc(slugOf(it.item_name)) + '</span></div>';
  }
  return '<div class="thumb"><span>' + esc(slugOf(it.item_name)) + '</span></div>';
}

let searchDebounce = null;
function onSearchInput(v) {
  state.q = v;
  render();
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => { refreshItems(); }, 280);
}

function startVoiceSearch() {
  if (state.voiceListening) return;
  startVoiceInput({
    lang: "en-IN",
    onStart: () => { state.voiceListening = true; render(); },
    onEnd: () => { state.voiceListening = false; render(); },
    onResult: text => { if (text) onSearchInput(text); },
    onError: err => { state.voiceListening = false; render(); showToast(errorMessage(err)); },
  });
}

async function placeOrder() {
  const lineData = Object.keys(state.cart).map(id => ({ item_id: Number(id), qty: state.cart[id] })).filter(l => l.qty > 0);
  const utrClean = state.utr.replace(/\D/g, "");
  if (lineData.length === 0 && !state.unlisted.trim()) return;
  setState({ placing: true, orderError: "" });
  try {
    const res = await authedApi("/api/orders", {
      method: "POST",
      json: { lines: lineData, unlisted_text: state.unlisted.trim(), utr: utrClean || null },
    });
    Object.assign(state, {
      placing: false, cartOpen: false,
      placed: {
        po: res.po_number, lines: res.lines.length, total: inr0(res.totals.grand_total),
        utr: res.utr || "", paid: !!res.utr,
      },
      cart: {}, unlisted: "", utr: "",
    });
    render();
    loadMyOrders();
  } catch (err) {
    setState({ placing: false, orderError: errorMessage(err) });
  }
}

function startNew() {
  setState({ placed: null, cat: "All", brand: "All", q: "" });
  refreshItems();
}

/* ---------------------------------------------------------------- render */

function render() {
  const app = document.getElementById("app");
  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if (active && app.contains(active) && active.id) {
    focusId = active.id; selStart = active.selectionStart; selEnd = active.selectionEnd;
  }
  app.innerHTML = state.booting ? bootingTpl() : (!state.token ? loginTpl() : mainTpl());
  wire();
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) {
        try { el.setSelectionRange(selStart, selEnd); } catch (err) { /* not a text-selectable input */ }
      }
    }
  }
}

function bootingTpl() {
  return '<div style="flex:1;display:grid;place-items:center;background:#f3f2f2"><div class="mono" style="font-size:12px;color:rgba(32,30,29,.55)">Loading your account…</div></div>';
}

function loginTpl() {
  return `
  <div style="position:absolute;inset:0;background:#f3f2f2;display:flex;flex-direction:column;z-index:5">
    <div style="background:#201e1d;color:#f3f2f2;padding:32px 24px 26px">
      <div class="mono" style="font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-bottom:8px">Customer sign in</div>
      <div style="font-size:26px;font-weight:800;letter-spacing:-0.02em">Pilani Supply Co.</div>
    </div>
    <div style="flex:1;padding:28px 24px">
      <div style="margin-bottom:16px">
        <label style="display:block;font-size:12px;margin-bottom:6px;color:rgba(32,30,29,.7)">Customer ID</label>
        <input id="loginId" value="${esc(state.loginId)}" placeholder="e.g. RAMESH01" style="width:100%;min-height:42px;padding:8px 12px;font-size:14px;font-family:'Archivo Narrow',monospace;letter-spacing:.04em;color:#201e1d;caret-color:#ec3013;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0"/>
      </div>
      <div style="margin-bottom:8px">
        <label style="display:block;font-size:12px;margin-bottom:6px;color:rgba(32,30,29,.7)">Password</label>
        <input id="loginPw" type="password" value="${esc(state.loginPw)}" placeholder="issued by the store" style="width:100%;min-height:42px;padding:8px 12px;font-size:14px;font-family:'Archivo Narrow',monospace;letter-spacing:.04em;color:#201e1d;caret-color:#ec3013;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0"/>
      </div>
      ${state.loginError ? `<div class="mono" style="font-size:12px;color:#ae1800;margin-bottom:12px">${esc(state.loginError)}</div>` : ""}
      <button data-action="login" style="width:100%;text-align:left;padding:13px 14px;font-weight:800;font-size:15px;background:#ec3013;color:#f3f2f2;border:0;cursor:pointer;margin-top:8px">${state.loginBusy ? "Signing in…" : "Sign in"}</button>
      ${!state.forgotOpen
        ? `<button data-action="openForgot" style="background:transparent;border:0;padding:0;margin-top:16px;font-size:12px;color:#ec3013;text-decoration:underline;text-underline-offset:3px;cursor:pointer">Forgot your password?</button>`
        : forgotTpl()}
    </div>
  </div>`;
}

function forgotTpl() {
  const st = state;
  if (st.forgotResult) {
    return `
    <div style="margin-top:16px;border:1px solid rgba(32,30,29,.4);padding:14px">
      <div style="font-size:13px;font-weight:800;margin-bottom:6px">Password reset</div>
      <div class="mono" style="font-size:12px;line-height:1.8;background:#eae9e9;padding:10px 12px;border-left:2px solid #ec3013;white-space:pre-wrap">id: ${esc(st.forgotResult.cust_code)}\nnew password: ${esc(st.forgotResult.password)}</div>
      <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-top:8px;line-height:1.6">Shown once — write it down now. Your old password no longer works.</div>
      <button data-action="closeForgot" style="width:100%;text-align:left;padding:10px 12px;font-weight:800;font-size:13px;background:#201e1d;color:#f3f2f2;border:0;cursor:pointer;margin-top:10px">Back to sign in</button>
    </div>`;
  }

  if (st.forgotStep === "verify") {
    return `
    <div style="margin-top:16px;border:1px solid rgba(32,30,29,.4);padding:14px">
      <div style="font-size:13px;font-weight:800;margin-bottom:2px">Enter the OTP</div>
      <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-bottom:12px;line-height:1.6">Call the store — they can read your one-time code off the admin portal. It's valid for 5 minutes.</div>
      <div style="margin-bottom:10px">
        <label style="display:block;font-size:12px;margin-bottom:6px;color:rgba(32,30,29,.7)">OTP</label>
        <input id="forgotOtp" value="${esc(st.forgotOtp)}" placeholder="6-digit code" class="mono" style="width:100%;min-height:38px;padding:8px 10px;font-size:13px;letter-spacing:.1em;color:#201e1d;caret-color:#ec3013;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0"/>
      </div>
      <div style="margin-bottom:10px">
        <label style="display:block;font-size:12px;margin-bottom:6px;color:rgba(32,30,29,.7)">New password (optional — pick one you'll remember, or leave blank for a random one)</label>
        <input id="forgotNewPw" value="${esc(st.forgotNewPw)}" placeholder="leave blank for a random password" style="width:100%;min-height:38px;padding:8px 10px;font-size:13px;font-family:'Archivo Narrow',monospace;letter-spacing:.04em;color:#201e1d;caret-color:#ec3013;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0"/>
      </div>
      ${st.forgotError ? `<div class="mono" style="font-size:12px;color:#ae1800;margin-bottom:10px">${esc(st.forgotError)}</div>` : ""}
      <div style="display:flex;gap:8px">
        <button data-action="doResetWithOtp" ${st.forgotBusy ? "disabled" : ""} style="flex:1;text-align:left;padding:10px 12px;font-weight:800;font-size:13px;background:#ec3013;color:#f3f2f2;border:0;cursor:pointer">${st.forgotBusy ? "Checking…" : "Reset password"}</button>
        <button data-action="closeForgot" style="padding:10px 12px;font-weight:800;font-size:13px;background:transparent;color:#201e1d;border:1px solid rgba(32,30,29,.4);cursor:pointer">Cancel</button>
      </div>
    </div>`;
  }

  return `
  <div style="margin-top:16px;border:1px solid rgba(32,30,29,.4);padding:14px">
    <div style="font-size:13px;font-weight:800;margin-bottom:2px">Reset your password</div>
    <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-bottom:12px;line-height:1.6">Enter your customer ID and the mobile number on file with the store — if they match, we'll send an OTP to the store for you to collect.</div>
    <div style="margin-bottom:10px">
      <label style="display:block;font-size:12px;margin-bottom:6px;color:rgba(32,30,29,.7)">Customer ID</label>
      <input id="forgotId" value="${esc(st.forgotId)}" placeholder="e.g. RAMESH01" style="width:100%;min-height:38px;padding:8px 10px;font-size:13px;font-family:'Archivo Narrow',monospace;letter-spacing:.04em;color:#201e1d;caret-color:#ec3013;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0"/>
    </div>
    <div style="margin-bottom:10px">
      <label style="display:block;font-size:12px;margin-bottom:6px;color:rgba(32,30,29,.7)">Mobile number</label>
      <input id="forgotPhone" value="${esc(st.forgotPhone)}" placeholder="on file with the store" style="width:100%;min-height:38px;padding:8px 10px;font-size:13px;font-family:'Archivo Narrow',monospace;letter-spacing:.04em;color:#201e1d;caret-color:#ec3013;background:#eae9e9;border:1px solid rgba(32,30,29,.4);border-radius:0"/>
    </div>
    ${st.forgotError ? `<div class="mono" style="font-size:12px;color:#ae1800;margin-bottom:10px">${esc(st.forgotError)}</div>` : ""}
    <div style="display:flex;gap:8px">
      <button data-action="doRequestOtp" ${st.forgotBusy ? "disabled" : ""} style="flex:1;text-align:left;padding:10px 12px;font-weight:800;font-size:13px;background:#ec3013;color:#f3f2f2;border:0;cursor:pointer">${st.forgotBusy ? "Checking…" : "Send OTP"}</button>
      <button data-action="closeForgot" style="padding:10px 12px;font-weight:800;font-size:13px;background:transparent;color:#201e1d;border:1px solid rgba(32,30,29,.4);cursor:pointer">Cancel</button>
    </div>
    <div class="mono" style="font-size:11px;color:rgba(32,30,29,.55);margin-top:12px;line-height:1.6">No mobile number on file, or it's changed? Ask the shopkeeper to reset it for you from the admin portal instead.</div>
  </div>`;
}

function mainTpl() {
  const st = state;
  const q = st.q.trim().toLowerCase();
  const items = st.items;

  const spotSrc = st.allItems.filter(it => it.promo_status);
  const spotlight = spotSrc.slice(0, 6);
  const showSpotlight = spotlight.length > 0 && !q;

  const freq = {};
  st.myOrders.forEach(o => {
    const seen = new Set();
    o.lines.forEach(l => { if (l.item_id != null) seen.add(l.item_id); });
    seen.forEach(id => { freq[id] = (freq[id] || 0) + 1; });
  });
  const repeats = Object.keys(freq)
    .map(id => itemById(id)).filter(Boolean)
    .sort((a, b) => freq[b.id] - freq[a.id]).slice(0, 4);
  const showRepeat = st.cat === "All" && !q && repeats.length > 0;

  const lineData = Object.keys(st.cart).map(id => {
    const it = itemById(id);
    if (!it) return null;
    const qty = st.cart[id];
    return { it, qty, selling: it.pricing.selling * qty, mrpTotal: (it.mrp || 0) * qty };
  }).filter(Boolean);
  const total = lineData.reduce((a, l) => a + l.selling, 0);
  const totalMrp = lineData.reduce((a, l) => a + l.mrpTotal, 0);
  const saved = totalMrp - total;
  const count = lineData.length;

  const utrClean = st.utr.replace(/\D/g, "");
  const utrOk = utrClean.length === 12;
  const unlistedLines = st.unlisted.split("\n").map(s => s.trim()).filter(Boolean);
  const canPlace = (count > 0 || unlistedLines.length > 0) && (utrClean.length === 0 || utrOk);

  return `
  <div style="flex:none;background:#f3f2f2;border-bottom:2px solid rgba(32,30,29,.4);padding:14px 16px 12px">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px">
      <div style="font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase">Pilani Supply Co.</div>
      <div style="display:flex;align-items:baseline;gap:10px">
        <div class="mono" style="font-size:11px;letter-spacing:.06em;color:rgba(32,30,29,.55)">${esc(st.custCode || "")}</div>
        <button data-action="openAccount" class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:0;color:#201e1d;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px">Password</button>
        <button data-action="logout" class="mono" style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:0;color:#ae1800;cursor:pointer;padding:0">Sign out</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;align-items:stretch">

    </div>
  </div>` : ""}

  ${st.toast ? `<div style="position:absolute;left:16px;right:16px;bottom:8px;background:#201e1d;color:#f3f2f2;padding:8px 12px;font-family:'Archivo Narrow',monospace;font-size:11px;z-index:20">${esc(st.toast)}</div>` : ""}
  `;
}

function wire() {
  const app = document.getElementById("app");
  app.oninput = e => {
    if (e.target.id === "loginId") state.loginId = e.target.value;
    else if (e.target.id === "loginPw") state.loginPw = e.target.value;
    else if (e.target.id === "forgotId") state.forgotId = e.target.value;
    else if (e.target.id === "forgotPhone") state.forgotPhone = e.target.value;
    else if (e.target.id === "forgotOtp") state.forgotOtp = e.target.value.replace(/[^0-9]/g, "").slice(0, 6);
    else if (e.target.id === "forgotNewPw") state.forgotNewPw = e.target.value;
    else if (e.target.id === "curPw") state.curPw = e.target.value;
    else if (e.target.id === "newPw") state.newPw = e.target.value;
    else if (e.target.id === "q") onSearchInput(e.target.value);
    else if (e.target.id === "unlisted") { state.unlisted = e.target.value; render(); }
    else if (e.target.id === "utr") { state.utr = e.target.value.replace(/[^0-9]/g, "").slice(0, 12); render(); }
  };
  app.onkeydown = e => {
    if (e.key === "Enter" && (e.target.id === "loginId" || e.target.id === "loginPw")) doLogin();
    if (e.key === "Enter" && (e.target.id === "forgotId" || e.target.id === "forgotPhone")) doRequestOtp();
    if (e.key === "Enter" && (e.target.id === "forgotOtp" || e.target.id === "forgotNewPw")) doResetWithOtp();
    if (e.key === "Enter" && (e.target.id === "curPw" || e.target.id === "newPw")) doChangePassword();
  };
  app.onclick = e => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.getAttribute("data-action");
    const id = btn.getAttribute("data-id");
    if (action === "login") doLogin();
    else if (action === "logout") logout();
    else if (action === "openForgot") openForgot();
    else if (action === "closeForgot") closeForgot();
    else if (action === "doRequestOtp") doRequestOtp();
    else if (action === "doResetWithOtp") doResetWithOtp();
    else if (action === "openAccount") openAccount();
    else if (action === "closeAccount") closeAccount();
    else if (action === "doChangePassword") doChangePassword();
    else if (action === "clearSearch") { state.q = ""; state.cat = "All"; state.brand = "All"; render(); refreshItems(); }
    else if (action === "voiceSearch") startVoiceSearch();
    else if (action === "pickCat" || action === "jumpCat") { state.cat = btn.getAttribute("data-cat"); state.q = ""; render(); refreshItems(); }
    else if (action === "pickBrand") { state.brand = btn.getAttribute("data-brand"); render(); refreshItems(); }
    else if (action === "inc") bump(id, 1);
    else if (action === "dec") bump(id, -1);
    else if (action === "openCart") setState({ cartOpen: true, orderError: "" });
    else if (action === "closeCart") setState({ cartOpen: false });
    else if (action === "placeOrder") placeOrder();
    else if (action === "startNew") startNew();
  };
}

render();
if (state.token) bootAuthed();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => { /* offline shell unavailable; app still works online */ });
  });
}
initPwaInstallPrompt({ appName: "Pilani Supply Co.", dismissKey: "pilani_pwa_dismiss_customer" });
</script>
</body>
</html>
